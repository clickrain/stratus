name: Static analysis

on:
  push:
    branches: [master]
  pull_request:
  # Nightly, so a new Craft 5 release that breaks an assumption in this plugin
  # surfaces without waiting for someone to push a commit. 07:00 UTC is roughly
  # 2am Central; GitHub runs cron in UTC and does not adjust for daylight time.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      # Report every PHP version rather than stopping at the first failure.
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # There is no committed lock file, so this always resolves the newest
      # craftcms/cms allowed by the constraint. That is deliberate: phpstan
      # bootstraps Craft out of vendor/, so analysing against a fresh Craft is
      # what makes the nightly run worth having.
      - name: Resolve dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Report resolved Craft version
        run: composer show craftcms/cms | grep -E '^versions|^name'

      - name: Run PHPStan
        run: >
          vendor/bin/phpstan analyse
          -c phpstan.neon
          --memory-limit=1G
          --no-progress
          --error-format=github
