name: CI

# Without this, a scheduled run is titled "CI" with nothing to distinguish it,
# so a year of nightlies reads as one repeated row. Push and pull request runs
# fall through to the default (commit message / PR title) via the empty string.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Nightly: latest Craft against master'
   || github.event_name == 'workflow_dispatch' && format('Manual run by {0}', github.actor)
   || '' }}

on:
  push:
    branches: [master]
  pull_request:
  # Nightly, so a new Craft release that breaks an assumption in this plugin
  # surfaces without waiting for someone to push a commit. 07:00 UTC is roughly
  # 2am Central; GitHub runs cron in UTC and does not adjust for daylight time.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # There is no committed lock file, so every job resolves the newest Craft the
  # constraint allows. That is the point: the nightly run is only worth having
  # if it tests against a Craft nobody has pinned.
  COMPOSER_FLAGS: --no-interaction --no-progress --prefer-dist

jobs:
  static-analysis:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update $COMPOSER_FLAGS
      - name: Report resolved Craft version
        run: composer show craftcms/cms | grep -E '^versions|^name'
      - run: >
          vendor/bin/phpstan analyse
          -c phpstan.neon
          --memory-limit=1G
          --no-progress
          --error-format=github

  conformance:
    name: Craft API conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update $COMPOSER_FLAGS
      - name: Report resolved Craft version
        run: composer show craftcms/cms | grep -E '^versions|^name'
      - run: vendor/bin/codecept run conformance

  integration:
    name: Integration tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl
          coverage: none
      - run: composer update $COMPOSER_FLAGS
      - name: Report resolved Craft version
        run: composer show craftcms/cms | grep -E '^versions|^name'
      # docker-compose.yml, not a `services:` block, so CI and a developer's
      # machine cannot end up on different MySQL versions. tests/_craft/config/
      # db.php already defaults to the port it publishes, so there is nothing
      # to configure here.
      - run: composer test:integration

  # Craft 6 alphas are already published and require PHP 8.5. This job is
  # allowed to fail: it exists so the size of the Craft 6 port is known months
  # before anyone is asked to do it, not to block anything today.
  next-major-canary:
    name: Craft 6 canary (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl
          coverage: none
      - name: Resolve against the Craft 6 alphas
        run: |
          composer config minimum-stability alpha
          composer require craftcms/cms:"^6.0" --no-update --no-interaction
          composer update $COMPOSER_FLAGS
      - name: Report resolved Craft version
        run: composer show craftcms/cms | grep -E '^versions|^name'
      - run: composer test
